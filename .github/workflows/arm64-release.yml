name: Build and Release Windows ARM64

on:
  push:
    branches:
      - 'arm64/v34.0.4'
    paths:
      - '.github/arm64-release-version'
      - '.github/workflows/arm64-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Nextcloud Desktop Windows ARM64
    runs-on: windows-11-arm
    env:
      CRAFT_TARGET: windows-msvc2022_arm64-cl
      CRAFT_MASTER_LOCATION: ${{ github.workspace }}\CraftMaster
      CRAFT_MASTER_CONFIG: ${{ github.workspace }}\craftmaster-arm64.ini

    steps:
      - name: Check out ARM64 release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up native ARM64 Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          architecture: 'arm64'

      - name: Verify release source
        id: version
        shell: pwsh
        run: |
          $upstreamTag = (Get-Content ".github\arm64-release-version").Trim()
          if ($upstreamTag -notmatch '^v(\d+)\.(\d+)\.(\d+)$') {
              Write-Error "Invalid upstream version marker: $upstreamTag"
              exit 1
          }

          $version = $upstreamTag.TrimStart('v')
          $cmake = Get-Content "VERSION.cmake" -Raw
          $major = [regex]::Match($cmake, 'MIRALL_VERSION_MAJOR\s+(\d+)').Groups[1].Value
          $minor = [regex]::Match($cmake, 'MIRALL_VERSION_MINOR\s+(\d+)').Groups[1].Value
          $patch = [regex]::Match($cmake, 'MIRALL_VERSION_PATCH\s+(\d+)').Groups[1].Value
          $sourceVersion = "$major.$minor.$patch"

          if ($sourceVersion -ne $version) {
              Write-Error "Source is $sourceVersion but release marker requests $version"
              exit 1
          }

          "upstream_tag=$upstreamTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_tag=v$version-arm64" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Building Nextcloud Desktop $version for native Windows ARM64"

      - name: Prepare patched pinned Craft revision
        shell: pwsh
        run: |
          $workspace = "${{ github.workspace }}"
          $craftClone = Join-Path $workspace "craft-clone"

          $config = Get-Content "craftmaster.ini"
          $craftUrlLine = $config | Where-Object { $_ -match '^\s*CraftUrl\s*=' } | Select-Object -First 1
          $craftRevLine = $config | Where-Object { $_ -match '^\s*CraftRevision\s*=' } | Select-Object -First 1

          if (-not $craftUrlLine -or -not $craftRevLine) {
              Write-Error "craftmaster.ini does not define CraftUrl/CraftRevision"
              exit 1
          }

          $craftUrl = ($craftUrlLine -split '=', 2)[1].Trim()
          $craftRev = ($craftRevLine -split '=', 2)[1].Trim()

          git clone $craftUrl $craftClone
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $craftClone checkout -f $craftRev
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $helperPath = Join-Path $craftClone "bin\CraftSetupHelper.py"
          $gitPath = Join-Path $craftClone "blueprints\dev-utils\_windows\git\git.py"
          $perlPath = Join-Path $craftClone "blueprints\dev-utils\perl\perl.py"
          $opensslPath = Join-Path $craftClone "blueprints\libs\openssl\openssl.py"
          $liblzmaPath = Join-Path $craftClone "blueprints\libs\liblzma\liblzma.py"
          $libunistringPath = Join-Path $craftClone "blueprints\libs\libunistring\libunistring.py"
          $libffiPath = Join-Path $craftClone "blueprints\libs\libffi\libffi.py"
          $pythonPath = Join-Path $craftClone "blueprints\libs\python\python.py"

          $required = @($helperPath, $gitPath, $perlPath, $opensslPath, $liblzmaPath, $libunistringPath, $libffiPath, $pythonPath)
          foreach ($path in $required) {
              if (-not (Test-Path $path)) {
                  Write-Error "Required Craft file not found: $path"
                  exit 1
              }
          }

          python ".github\scripts\patch-craft-arm64.py" $helperPath $gitPath $perlPath $opensslPath $liblzmaPath $libunistringPath $libffiPath $pythonPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git -C $craftClone config user.name "ARM64 Build Bot"
          git -C $craftClone config user.email "actions@users.noreply.github.com"
          git -C $craftClone add -A
          git -C $craftClone commit -m "build: apply Windows ARM64 Craft compatibility patches"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $patchedRevision = (git -C $craftClone rev-parse HEAD).Trim()

          Copy-Item "craftmaster.ini" "${{ github.workspace }}\craftmaster-arm64.ini"
          $armConfig = Get-Content "${{ github.workspace }}\craftmaster-arm64.ini"
          $armConfig = $armConfig -replace '^\s*CraftRevision\s*=.*$', "CraftRevision = $patchedRevision"
          Set-Content -Path "${{ github.workspace }}\craftmaster-arm64.ini" -Value $armConfig -Encoding utf8

          Write-Host "Upstream Craft revision: $craftRev"
          Write-Host "Patched local Craft revision: $patchedRevision"

      - name: Install Craft and ARM64 dependencies
        shell: pwsh
        run: |
          & cmd /C "git clone -q --depth=1 https://invent.kde.org/packaging/craftmaster.git ${{ env.CRAFT_MASTER_LOCATION }} 2>&1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          function craft() {
              python "${{ env.CRAFT_MASTER_LOCATION }}\CraftMaster.py" --config "${{ env.CRAFT_MASTER_CONFIG }}" --target ${{ env.CRAFT_TARGET }} -c $args
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          craft --add-blueprint-repository "https://github.com/nextcloud/craft-blueprints-kde.git|stable-34.0|"
          craft --add-blueprint-repository "https://github.com/nextcloud/craft-blueprints-nextcloud.git|stable-34.0|"
          craft craft

          $workspace = "${{ github.workspace }}"
          $craftClone = Join-Path $workspace "craft-clone"

          $ncBlueprint = Join-Path $workspace "${{ env.CRAFT_TARGET }}\etc\blueprints\locations\craft-blueprints-nextcloud\nextcloud-client\nextcloud-client.py"
          if (-not (Test-Path $ncBlueprint)) {
              Write-Error "Nextcloud blueprint not found: $ncBlueprint"
              exit 1
          }

          python ".github\scripts\patch-nsis-and-blueprint.py" $craftClone $ncBlueprint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $kdeBlueprints = Join-Path $workspace "${{ env.CRAFT_TARGET }}\etc\blueprints\locations\craft-blueprints-kde"
          $libjpeg = Join-Path $kdeBlueprints "libs\libjpeg-turbo\libjpeg-turbo.py"
          $pixman = Join-Path $kdeBlueprints "libs\pixman\pixman.py"

          python ".github\scripts\patch-kde-blueprints-arm64.py" $libjpeg $pixman
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          craft --install-deps nextcloud-client

      - name: Install Inkscape
        shell: pwsh
        continue-on-error: true
        run: choco install inkscape --no-progress -y

      - name: Add Craft binaries to PATH
        shell: pwsh
        run: |
          echo "${{ github.workspace }}\${{ env.CRAFT_TARGET }}\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Compile Nextcloud Desktop
        shell: pwsh
        run: |
          function craft() {
              python "${{ env.CRAFT_MASTER_LOCATION }}\CraftMaster.py" --config "${{ env.CRAFT_MASTER_CONFIG }}" --target ${{ env.CRAFT_TARGET }} -c $args
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          craft --src-dir "${{ github.workspace }}" nextcloud-client

      - name: Package ARM64 installer
        shell: pwsh
        run: |
          function craft() {
              python "${{ env.CRAFT_MASTER_LOCATION }}\CraftMaster.py" --config "${{ env.CRAFT_MASTER_CONFIG }}" --target ${{ env.CRAFT_TARGET }} -c $args
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          craft --src-dir "${{ github.workspace }}" --package nextcloud-client

      - name: Validate ARM64 binary
        shell: pwsh
        run: |
          $root = Join-Path "${{ github.workspace }}" "${{ env.CRAFT_TARGET }}"
          $exe = Get-ChildItem -Path $root -Recurse -Filter nextcloud.exe -File -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -notmatch '\\downloads\\|\\archive\\' } |
                 Sort-Object LastWriteTime -Descending |
                 Select-Object -First 1

          if (-not $exe) {
              Write-Error "Could not locate built nextcloud.exe"
              exit 1
          }

          $bytes = [System.IO.File]::ReadAllBytes($exe.FullName)
          if ($bytes.Length -lt 256) {
              Write-Error "nextcloud.exe is unexpectedly small"
              exit 1
          }

          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)

          Write-Host ("nextcloud.exe: {0}" -f $exe.FullName)
          Write-Host ("PE machine: 0x{0:X4}" -f $machine)

          if ($machine -ne 0xAA64) {
              Write-Error ("Expected ARM64 PE machine 0xAA64, got 0x{0:X4}" -f $machine)
              exit 1
          }

      - name: Locate installer
        id: installer
        shell: pwsh
        run: |
          $root = Join-Path "${{ github.workspace }}" "${{ env.CRAFT_TARGET }}"
          $candidates = Get-ChildItem -Path $root -Recurse -Include *.exe,*.msi -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match '(?i)nextcloud.*(setup|installer|arm64|\.msi$)' } |
              Sort-Object LastWriteTime -Descending

          if (-not $candidates) {
              Write-Error "No Nextcloud installer artifact found"
              exit 1
          }

          $source = $candidates[0]
          $releaseName = "Nextcloud-${{ steps.version.outputs.version }}-Windows-ARM64-setup.exe"
          $dest = Join-Path $env:RUNNER_TEMP $releaseName
          Copy-Item $source.FullName $dest

          "path=$dest" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "name=$releaseName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Release installer: $dest"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nextcloud-desktop-windows-arm64-${{ steps.version.outputs.version }}
          path: ${{ steps.installer.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Nextcloud Desktop ${{ steps.version.outputs.version }} for Windows ARM64
          draft: false
          prerelease: false
          files: ${{ steps.installer.outputs.path }}
          body: |
            # Nextcloud Desktop ${{ steps.version.outputs.version }} — Windows ARM64

            Native ARM64 build of the official Nextcloud Desktop Client for Windows on ARM.

            - Upstream source: \`${{ steps.version.outputs.upstream_tag }}\`
            - Architecture: native ARM64 / AArch64
            - Target: Windows 11 ARM64
            - Build system: KDE Craft + MSVC 2022
            - ARM64 binary validation: PE machine \`0xAA64\`

            Intended for Snapdragon X, Surface Pro 11, Surface Laptop 7, Windows Dev Kit 2023, and other Windows-on-ARM systems.

            This is an unofficial community build and is not an official Nextcloud GmbH binary.

      - name: Attempt SEO repository metadata update
        shell: pwsh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $description = "Native Nextcloud Desktop Client ARM64 for Windows on ARM, Snapdragon X, Surface Pro 11 and other Windows ARM64 PCs."
          gh api --method PATCH "repos/${{ github.repository }}" -f description="$description"

          $topics = @{
              names = @(
                  "nextcloud",
                  "nextcloud-client",
                  "nextcloud-desktop",
                  "arm64",
                  "windows-arm64",
                  "windows-on-arm",
                  "snapdragon"
              )
          } | ConvertTo-Json -Compress
          $topics | gh api --method PUT "repos/${{ github.repository }}/topics" --input -

          gh api --method PATCH "repos/${{ github.repository }}" -f name="nextcloud-client-arm64-windows"
