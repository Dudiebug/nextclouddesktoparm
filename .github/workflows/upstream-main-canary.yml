name: Test ARM64 overlay against upstream main

on:
  push:
    branches: ['master']
    paths: ['.github/workflows/upstream-main-canary.yml']
  schedule:
    - cron: '47 7 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even when upstream main has not changed'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: upstream-main-arm64-canary
  cancel-in-progress: true

jobs:
  refresh-canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Refresh canary only when upstream main changes
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ARM64 Canary Bot'
          git config user.email 'actions@users.noreply.github.com'

          git remote add upstream https://github.com/nextcloud/desktop.git 2>/dev/null || true
          git fetch upstream '+refs/heads/master:refs/remotes/upstream/master'
          git fetch origin '+refs/heads/arm64-tooling:refs/remotes/origin/arm64-tooling'
          git fetch origin '+refs/heads/canary/upstream-main:refs/remotes/origin/canary/upstream-main' 2>/dev/null || true

          upstream_sha="$(git rev-parse upstream/master)"
          previous_sha="$(git show origin/canary/upstream-main:.github/upstream-main-sha 2>/dev/null || true)"
          previous_sha="$(printf '%s' "$previous_sha" | tr -d '\r\n')"

          if [[ "$upstream_sha" == "$previous_sha" && "${FORCE:-false}" != "true" ]]; then
            echo "Upstream main has not changed: $upstream_sha"
            exit 0
          fi

          git checkout -B canary/upstream-main "$upstream_sha"
          git checkout origin/arm64-tooling -- .github/scripts .github/workflows/arm64-release.yml
          mkdir -p .github
          printf '%s\n' "$upstream_sha" > .github/upstream-main-sha

          git add .github
          git commit -m "ci: test ARM64 overlay against upstream main ${upstream_sha:0:12}"
          git push origin HEAD:refs/heads/canary/upstream-main --force

          # Canary uses the same full ARM64 build but its release step is disabled.
          gh workflow run arm64-release.yml --ref canary/upstream-main
